<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="meta.title">Digital World Patcher · Digimon World DS, Dawn, Dusk</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 58 18v28L32 61 6 46V18z' fill='%23ff8a1f'/%3E%3Crect x='17' y='19' width='30' height='22' rx='4' fill='%230b1a33'/%3E%3Cpath d='M22 34l6-8 5 5 4-6 5 9' stroke='%2337e0ff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
</head><body>
<!-- texts: data-i18n (content), data-i18n-title, data-i18n-ph (placeholder) -> web/i18n/<lang>.json -->
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 58 18v28L32 61 6 46V18z" class="lg-shell"/><path d="M32 9 52 20.5v23L32 55 12 43.5v-23z" class="lg-ring"/><rect x="18" y="20" width="28" height="20" rx="3" class="lg-screen"/><path d="M22 34l6-8 5 5 4-6 5 9" class="lg-wave"/><circle cx="32" cy="48" r="3" class="lg-btn"/></svg>
    <div><h1>Digital World Patcher</h1><p class="sub" data-i18n="head.sub"></p></div>
  </div>
  <div class="sound" id="soundbar">
    <button id="mute" class="icon-btn" data-i18n-title="head.mute">🔇</button>
    <input id="vol" type="range" min="0" max="1" step="0.05" data-i18n-title="head.volume">
    <select id="theme" disabled><option data-i18n="head.music"></option></select>
    <select id="lang" data-i18n-title="head.lang"></select>
    <a class="gh" href="https://github.com/kirides/digital-world-patcher" data-i18n-title="head.github"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a>
  </div>
</header>

<main>
<p class="lead" data-i18n="lead"></p>

<section class="card" id="step1"><h2><span class="step">1</span> <span data-i18n="s1.title"></span></h2>
<div id="drop"><div class="drop-ico">⬢</div><p><span data-i18n="s1.drop"></span> <label class="link"><span data-i18n="s1.choose"></span><input type="file" id="rom" accept=".nds" hidden></label></p>
<p class="mut" data-i18n="s1.hint"></p><p id="msg1"></p></div>
</section>

<div id="main" class="hide">
<section class="card"><h2><span class="step">2</span> <span data-i18n="s2.title"></span> <span class="mut" data-i18n="s2.sub"></span></h2>
<div class="toolbar">
  <label class="field"><span data-i18n="s2.preset"></span> <select id="preset"></select></label>
  <button id="apply" data-i18n="s2.apply"></button>
  <span class="grow"></span>
  <button id="exp" class="ghost" data-i18n="s2.export"></button> <button id="impb" class="ghost" data-i18n="s2.import"></button><input type="file" id="imp" accept=".json" hidden>
</div>
<div class="reach"><p id="reach"></p><p id="missing" class="chips"></p></div>
<div id="ed">
  <div class="side"><input id="q" data-i18n-ph="s2.search"><label class="chk"><input type="checkbox" id="onlychg"> <span data-i18n="s2.onlyChanged"></span></label><div id="list"></div></div>
  <div id="detail"></div>
</div>
</section>

<section class="card"><h2><span class="step">3</span> <span data-i18n="s3.title"></span></h2>
<div class="opts">
  <div id="trbox" class="opts"></div>
  <label id="enclab" class="opt"><input type="checkbox" id="enc" checked><span id="enctext"></span></label>
  <label class="opt"><input type="checkbox" id="evo" checked><span data-i18n="s3.evo"></span></label>
  <label id="encedlab" class="opt hide"><input type="checkbox" id="enced" checked><span id="encedtext"></span></label>
</div>
<button id="go" class="primary" data-i18n="s3.go"></button> <span id="msg"></span>
</section>
<section class="card" id="encs"><h2><span class="step">⌕</span> <span data-i18n="enc.title"></span> <span class="mut" data-i18n="enc.sub"></span></h2>
<div class="toolbar">
  <button type="button" class="pick" id="encpick"></button>
  <button type="button" class="ghost" id="encall" data-i18n="enc.all"></button>
  <label id="encmodlab" class="chk"><input type="checkbox" id="encmod"> <span id="encmodtext"></span></label>
</div>
<p id="encsum" class="mut"></p>
<div id="enclist"></div>
</section>
<details class="card soundtest" id="soundtest"><summary><span class="step">♪</span> <span data-i18n="st.title"></span> <span class="mut" data-i18n="st.sub"></span></summary>
<p class="mut" data-i18n="st.hint"></p>
<div class="st-grid"><div><h4 data-i18n="st.music"></h4><div id="st-music" class="st-list"></div></div><div><h4 data-i18n="st.se"></h4><div id="st-se" class="st-list"></div></div></div>
</details>
<p class="mut foot"><span data-i18n="foot"></span> <a href="https://github.com/kirides/digital-world-patcher">github.com/kirides/digital-world-patcher</a></p>
</div>
</main>
<div id="pop" class="hide"><input id="popq" data-i18n-ph="ed.search"><div id="popl"></div></div>
<div id="flash" class="hide"></div>

<script src="core.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body></html>
